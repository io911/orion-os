name: Build Orion OS
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: orion-bootc
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Checkout Repository
        uses: actions/checkout@v5

      # STEP 1: Log into GHCR via Podman (built natively into modern GitHub Ubuntu runners)
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 2: Build the unoptimized image directly into Podman's local cache
      - name: Build Local Bootc Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          podman build \
            -t ${IMAGE_LOWER}:unoptimized \
            -f ./Containerfile .

      # STEP 3: Rechunk using Podman's native ability to share its local user storage
      - name: Rechunk Bootc Image for Incremental Updates
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # By mounting Podman's native user cache (~/.local/share/containers/storage) 
          # directly into the container, the tool can read and write chunks at full kernel speed
          podman run --rm --privileged \
            --device /dev/fuse \
            -v /home/runner/.local/share/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/centos-bootc:stream10 \
            /usr/libexec/bootc-base-imagectl rechunk \
            containers-storage:${IMAGE_LOWER}:unoptimized \
            ${IMAGE_LOWER}:latest

      # STEP 4: Push the cleanly optimized image straight to GitHub Packages via Podman
      - name: Push Container to GitHub Packages
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          podman push ${IMAGE_LOWER}:latest
