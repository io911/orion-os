name: Build Orion OS
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: orion-bootc
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Bootc Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ${IMAGE_LOWER}:unoptimized \
            -f ./Containerfile .

      # STEP 1: Export the image out of Docker cleanly
      - name: Save Unoptimized Image to Disk
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker save ${IMAGE_LOWER}:unoptimized -o unoptimized.tar

      # STEP 2: High-Speed Rechunk via fuse-overlayfs
      - name: Rechunk Bootc Image for Incremental Updates
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          mkdir -p $(pwd)/output-dir
          
          # Key Upgrades here:
          # 1. We map /dev/fuse to handle nested image extraction at high speeds
          # 2. We use STORAGE_DRIVER=overlay with mount_program to use fuse-overlayfs
          # 3. We keep ulimit dropped down to avoid the initialization freeze
          docker run --rm --privileged \
            --device /dev/fuse \
            --ulimit nofile=4096:4096 \
            -e STORAGE_DRIVER=overlay \
            -e STORAGE_OPTS="mount_program=/usr/bin/fuse-overlayfs" \
            -v $(pwd):/workspace \
            quay.io/centos-bootc/centos-bootc:stream10 \
            /usr/libexec/bootc-base-imagectl rechunk \
            docker-archive:/workspace/unoptimized.tar \
            ${IMAGE_LOWER}:latest

      # STEP 3: Export optimized container back using high-speed overlay configs
      - name: Export Optimized Image Archive
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          docker run --rm --privileged \
            --device /dev/fuse \
            --ulimit nofile=4096:4096 \
            -e STORAGE_DRIVER=overlay \
            -e STORAGE_OPTS="mount_program=/usr/bin/fuse-overlayfs" \
            -v $(pwd):/workspace \
            quay.io/centos-bootc/centos-bootc:stream10 \
            skopeo copy \
            containers-storage:${IMAGE_LOWER}:latest \
            docker-archive:/workspace/output-dir/optimized.tar:${IMAGE_LOWER}:latest

      # STEP 4: Reload the finalized image to the host Docker engine
      - name: Load Optimized Image back into Docker
        run: |
          docker load -i output-dir/optimized.tar

      # STEP 5: Push the cleanly optimized image to GitHub Packages
      - name: Push Container to GitHub Packages
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker push ${IMAGE_LOWER}:latest
