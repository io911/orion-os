name: Build Orion OS
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: orion-bootc
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Checkout Repository
        uses: actions/checkout@v5

      # STEP 1: Log into GHCR via native rootless Podman configuration
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 2: Build the standard unoptimized Image
      - name: Build Local Bootc Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          podman build \
            -t ${IMAGE_LOWER}:unoptimized \
            -f ./Containerfile .

      # STEP 3: Extract the tool binary directly onto the host runner's local execution space
      - name: Extract Rechunker Tool Binary
        run: |
          mkdir -p bin
          podman create --name tool-extractor quay.io/centos-bootc/centos-bootc:stream10
          podman cp tool-extractor:/usr/libexec/bootc-base-imagectl ./bin/bootc-base-imagectl
          podman rm tool-extractor
          chmod +x ./bin/bootc-base-imagectl

      # STEP 4: Run the rechunker natively on the host runner disk space
      # Since it runs natively on the host, it shares the exact local Podman database without errors.
      - name: Rechunk Bootc Image Natively
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Execute the extracted binary directly as a rootless host operation
          ./bin/bootc-base-imagectl rechunk \
            containers-storage:${IMAGE_LOWER}:unoptimized \
            containers-storage:${IMAGE_LOWER}:latest

      # STEP 5: Push the final optimized tag out to GitHub Packages via Podman
      - name: Push Container to GitHub Packages
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          podman push ${IMAGE_LOWER}:latest
