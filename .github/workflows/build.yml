name: Build Orion OS
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: orion-bootc
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Bootc Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ${IMAGE_LOWER}:unoptimized \
            -f ./Containerfile .

      # STEP 1: Export the unoptimized OCI image out of Docker to a flat tar file
      - name: Save Unoptimized Image to Disk
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker save ${IMAGE_LOWER}:unoptimized -o unoptimized.tar

      # STEP 2: Rechunk by passing only the RAW image name string as the target argument
      - name: Rechunk Bootc Image for Incremental Updates
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          mkdir -p $(pwd)/output-dir
          
          # Pass the raw reference string. The tool appends containers-storage: natively.
          docker run --rm --privileged \
            -e STORAGE_DRIVER=vfs \
            -v $(pwd):/workspace \
            quay.io/centos-bootc/centos-bootc:stream10 \
            /usr/libexec/bootc-base-imagectl rechunk \
            docker-archive:/workspace/unoptimized.tar \
            ${IMAGE_LOWER}:latest

          # STEP 3: Export the chunked container image safely out to our workspace folder using Skopeo
          docker run --rm --privileged \
            -e STORAGE_DRIVER=vfs \
            -v $(pwd):/workspace \
            quay.io/centos-bootc/centos-bootc:stream10 \
            skopeo copy \
            containers-storage:${IMAGE_LOWER}:latest \
            docker-archive:/workspace/output-dir/optimized.tar:${IMAGE_LOWER}:latest

      # STEP 4: Reload the finalized, package-optimized image directly into the host runner's Docker Engine
      - name: Load Optimized Image back into Docker
        run: |
          docker load -i output-dir/optimized.tar

      # STEP 5: Push the final optimized tag out to GitHub Packages cleanly
      - name: Push Container to GitHub Packages
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker push ${IMAGE_LOWER}:latest
