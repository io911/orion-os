name: Build Orion OS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: orion-bootc
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  BASE_IMAGE: quay.io/fedora/fedora-bootc:44

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Checkout Repository
        uses: actions/checkout@v5

      # STEP 1: Log into GHCR inside the root execution context
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # STEP 2: Build the unoptimized image passing the central ENV string correctly
      - name: Build Local Bootc Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          sudo podman build \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t ${IMAGE_LOWER}:unoptimized \
            -f ./Containerfile .

      # STEP 3: Optimized Fast Rechunking
      - name: Rechunk Bootc Image for Incremental Updates
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # 1. Mount the shared socket AND local storage paths
          # 2. Leverage a tempfs RAM disk for the tool's temporary workspace
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            --tmpfs /tmp:rw,size=4G \
            ${{ env.BASE_IMAGE }} \
            /usr/libexec/bootc-base-imagectl rechunk \
            containers-storage:${IMAGE_LOWER}:unoptimized \
            containers-storage:${IMAGE_LOWER}:latest

      # STEP 4: Push the final optimized production tag with zstd:chunked compression
      - name: Push Container to GitHub Packages
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          sudo podman push --compression-format=zstd:chunked containers-storage:${IMAGE_LOWER}:latest
