name: Build Orion OS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: orion-bootc
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  BASE_IMAGE: quay.io/fedora/fedora-bootc:44

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        if: github.event_name == 'schedule'  # Only during scheduled runs 
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Checkout Repository
        uses: actions/checkout@v5

      # Cache DNF packages across workflow runs instead of raw engine storage
      - name: Cache DNF Downloads
        uses: actions/cache@v4
        with:
          path: /tmp/dnf-cache
          key: ${{ runner.os }}-dnf-${{ hashFiles('**/Containerfile') }}
          restore-keys: |
            ${{ runner.os }}-dnf-

      # STEP 1: Log into GHCR inside the root execution context
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # STEP 2: Build image with mounted host DNF cache
      - name: Build Local Bootc Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p /tmp/dnf-cache
          sudo podman build \
            -v /tmp/dnf-cache:/var/cache/dnf:Z \
            --build-arg BASE_IMAGE=${{ env.BASE_IMAGE }} \
            -t ${IMAGE_LOWER}:unoptimized \
            -f ./Containerfile .

      # STEP 3: Rechunk Bootc Image ONLY on release pushes to main branch or scheduled runs
      - name: Rechunk Bootc Image for Incremental Updates
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Create a dummy container placeholder to mock systemd behavior and bypass timeouts
          sudo mkdir -p /tmp/mock-bin
          echo -e '#!/bin/sh\nexit 0' | sudo tee /tmp/mock-bin/systemctl > /dev/null
          sudo chmod +x /tmp/mock-bin/systemctl

          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v /tmp/mock-bin/systemctl:/usr/bin/systemctl:ro \
            -v /tmp/mock-bin/systemctl:/usr/sbin/systemctl:ro \
            --tmpfs /tmp:rw,size=8G \
            ${{ env.BASE_IMAGE }} \
            /usr/libexec/bootc-base-imagectl rechunk \
            ${IMAGE_LOWER}:unoptimized \
            ${IMAGE_LOWER}:latest

      # STEP 4: Push the final optimized production tag with zstd:chunked compression
      - name: Push Container to GitHub Packages
        if: github.ref == 'refs/heads/main'  # Only on main branch
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          sudo podman push --compression-format=zstd:chunked ${IMAGE_LOWER}:latest
