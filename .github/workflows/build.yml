name: Build Orion OS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: orion-bootc
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  BASE_IMAGE: quay.io/fedora/fedora-bootc:44

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Checkout Repository
        uses: actions/checkout@v5

      # STEP 1: Log into GHCR inside the root execution context
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # STEP 2: Build the unoptimized image passing the central ENV string correctly
      - name: Build Local Bootc Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          sudo podman build \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t ${IMAGE_LOWER}:unoptimized \
            -f ./Containerfile .

      # STEP 3: Rechunk using the cached local base image layers
      - name: Rechunk Bootc Image for Incremental Updates
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Using env.BASE_IMAGE avoids a fresh network pull entirely.
          # The runner extracts bootc-base-imagectl straight from local storage cache.
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ${{ env.BASE_IMAGE }} \
            /usr/libexec/bootc-base-imagectl rechunk \
            ${IMAGE_LOWER}:unoptimized \
            ${IMAGE_LOWER}:latest

      # STEP 4: Push the final optimized production tag directly from rootful storage
      - name: Push Container to GitHub Packages
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          sudo podman push ${IMAGE_LOWER}:latest
